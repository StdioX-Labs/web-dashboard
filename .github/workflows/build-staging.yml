name: Build Staging Images

# Builds the staging image from the Keycloak branch,
# tagged :staging and :staging-<sha>. Prod's :latest tags are never touched.
on:
  push:
    branches:
      - feat/keycloak-staging
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: version
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/stdiox-labs/web-dashboard:staging
            ${{ env.REGISTRY }}/stdiox-labs/web-dashboard:staging-${{ steps.version.outputs.SHORT_SHA }}
          build-args: |
            BUILD_SHA=${{ steps.version.outputs.SHORT_SHA }}
          cache-from: type=gha,scope=web-dashboard
          cache-to: type=gha,mode=max,scope=web-dashboard
          provenance: false
